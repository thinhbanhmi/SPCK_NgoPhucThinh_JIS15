<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Palette Studio</title>
    
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Firebase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-storage-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"></script>

    <!-- Scripts dự án -->
    <script src="./script/firebase-config.js"></script>
    <script src="./script/register.js"></script>

    <style>
        body {
            background: linear-gradient(180deg, #a8ffb2 0%, #c4fca2 40%, #ffe993 100%);
            min-height: 100vh;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #2d3748;
        }

        .card-custom {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(100, 160, 90, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* --- LOGO PALETTE TO & SPACING RỘNG --- */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .logo-svg {
            width: 290px;
            height: auto;
        }

        /* --- STYLES FORM ĐĂNG KÝ --- */
        .form-control {
            border-radius: 12px;
            padding: 0.7rem 0.85rem;
            border: 1px solid #d1fae5;
            background-color: rgba(255, 255, 255, 0.9);
            color: #1f2937;
            transition: all 0.2s ease-in-out;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #34d399;
            box-shadow: 0 0 0 0.25rem rgba(52, 211, 153, 0.25);
        }

        .input-group-text {
            border-radius: 12px 0 0 12px;
            background-color: rgba(236, 253, 245, 0.8);
            border: 1px solid #d1fae5;
            color: #059669;
        }

        .input-group .form-control {
            border-radius: 0 12px 12px 0;
        }

        .btn-register-custom {
            background: linear-gradient(135deg, #5eead4 0%, #34d399 50%, #10b981 100%);
            border: none;
            border-radius: 14px;
            padding: 0.75rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            transition: all 0.2s ease;
        }

        .btn-register-custom:hover {
            background: linear-gradient(135deg, #2dd4bf 0%, #10b981 50%, #059669 100%);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.4);
        }

        a.login-link {
            color: #059669;
            text-decoration: none;
            font-weight: 600;
        }

        a.login-link:hover {
            color: #047857;
            text-decoration: underline;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-6 col-lg-4">
                <div class="card card-custom p-4 p-sm-4">
                    
                    <!-- LOGO PALETTE TĂNG SIZE & RỘNG KHOẢNG CÁCH -->
                    <div class="logo-container">
                        <svg class="logo-svg" viewBox="0 0 420 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="calligraphyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#10b981" />
                                    <stop offset="60%" stop-color="#059669" />
                                    <stop offset="100%" stop-color="#047857" />
                                </linearGradient>
                                
                                <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
                                    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.12"/>
                                </filter>
                            </defs>
                            
                            <g filter="url(#softGlow)">
                                <!-- Icon Chữ P Calligraphy Thanh Mảnh (Căn giữa) -->
                                <path d="M 175 32 C 192 16, 228 18, 238 36 C 246 52, 235 70, 212 76 C 195 80, 180 72, 180 58 C 180 46, 192 38, 205 42" 
                                      fill="none" stroke="url(#calligraphyGrad)" stroke-width="2.5" stroke-linecap="round"/>
                                
                                <path d="M 208 18 C 210 30, 211 60, 210 92 C 209 108, 203 118, 192 122 C 186 124, 180 120, 184 114 C 188 108, 198 106, 202 94 C 205 85, 205 45, 202 18 Z" 
                                      fill="url(#calligraphyGrad)"/>

                                <path d="M 202 28 C 172 28, 152 52, 152 76 C 152 104, 182 118, 208 98" 
                                      fill="none" stroke="url(#calligraphyGrad)" stroke-width="3" stroke-linecap="round"/>

                                <!-- Tên PALETTE To (size 30) & Spacing Rộng (spacing 16) -->
                                <text x="210" y="155" 
                                      text-anchor="middle"
                                      font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
                                      font-size="30" 
                                      font-weight="600" 
                                      letter-spacing="16" 
                                      fill="url(#calligraphyGrad)">PALETTE</text>

                                <!-- Nét Uốn Ôm Rộng Dưới Chân Chữ -->
                                <path d="M 385 162 C 345 173, 275 178, 210 178 C 145 178, 75 173, 35 162" 
                                      fill="none" stroke="url(#calligraphyGrad)" stroke-width="2.2" stroke-linecap="round"/>
                            </g>
                        </svg>
                    </div>

                    <h5 class="text-center fw-bold text-secondary mb-3">Đăng Ký Tài Khoản</h5>
                    
                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Họ và tên</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input id="txt-fullname" type="text" class="form-control" placeholder="Nhập họ tên" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input id="txt-email" type="email" class="form-control" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary small">Mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input id="txt-password" type="password" class="form-control" placeholder="Tạo mật khẩu" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small">Xác nhận mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                <input id="txt-confirm-password" type="password" class="form-control" placeholder="Nhập lại mật khẩu" required>
                            </div>
                        </div>

                        <button id="btn-register" type="submit" class="btn btn-register-custom w-100 mb-3">
                            Tạo tài khoản
                        </button>
                    </form>

                    <div class="text-center pt-2 border-top">
                        <small class="text-muted">Đã có tài khoản? <a href="login.html" class="login-link">Đăng nhập ngay</a></small>
                    </div>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
