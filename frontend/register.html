<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Firebase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"
        integrity="sha512-gCJuoyvPlJMaTPkYPfyfEt1KYPvoEE9PgGHlOU+Qtg+kLbBfEbiiim4PDj2ATWLc6BN0irZnNbdgzCtX53vjXQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"
        integrity="sha512-Xxpv+NpwNyir+77oEME5XeixRoRLrI4eY0bBZSMHgWLEFbc0f+JP4Nax3t/qDuYg1hgWrSl8pUapb+AO5Lp1jA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-storage-compat.min.js"
        integrity="sha512-l/ieVoEShBQI9lKOdMY4AAV9rzEE5YHKF8XB4m3Qn3DtK9AhYSOgyDWrL2XH1lhKS4Fde+PNoDiBoT7UhcP23A=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Firebase Authentication -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"
        integrity="sha512-PgwIBKz/MWPvQvKq7MUWB5x5aCyiiXTnAtbUGqbBvylcD/oASXh8wap5g1lWpzPmNraLXWzuWx8bkZ+reKYoyQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Firebase configuration script -->
    <script src="./script/firebase-config.js"></script>
    <script src="./script/register.js"></script>
</head>
<body class="bg-light d-flex align-items-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-5 col-lg-4">
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="text-center fw-bold mb-3">Đăng Ký</h3>
                    
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Họ và tên</label>
                            <input id="txt-fullname" type="text" class="form-control" placeholder="Nhập họ tên" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input id="txt-email" type="email" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input id="txt-password" type="password" class="form-control" placeholder="Tạo mật khẩu" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Xác nhận mật khẩu</label>
                            <input id="txt-confirm-password" type="password" class="form-control" placeholder="Nhập lại mật khẩu" required>
                        </div>
                        <button id="btn-register" type="submit" class="btn btn-success w-100 mb-3">Tạo tài khoản</button>
                    </form>

                    <div class="text-center">
                        <small class="text-muted">Đã có tài khoản? <a href="login.html">Đăng nhập</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
