<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Firebase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"
        integrity="sha512-gCJuoyvPlJMaTPkYPfyfEt1KYPvoEE9PgGHlOU+Qtg+kLbBfEbiiim4PDj2ATWLc6BN0irZnNbdgzCtX53vjXQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"
        integrity="sha512-Xxpv+NpwNyir+77oEME5XeixRoRLrI4eY0bBZSMHgWLEFbc0f+JP4Nax3t/qDuYg1hgWrSl8pUapb+AO5Lp1jA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Firebase Authentication -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"
        integrity="sha512-PgwIBKz/MWPvQvKq7MUWB5x5aCyiiXTnAtbUGqbBvylcD/oASXh8wap5g1lWpzPmNraLXWzuWx8bkZ+reKYoyQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Firebase configuration script -->
    <script src="./script/firebase-config.js"></script>
    <script src="./script/cart.js" defer></script>
    <script src="./script/navbar.js" defer></script>
    <script src="./script/pay.js" defer></script>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="./index.html">Shop bán oxy
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="./cart.html" class="btn btn-outline-light btn-sm">
                    Giỏ hàng <span id="cart-count" class="badge bg-danger">0</span>
                </a>
                <div id="group-login">
                    <a href="./login.html" class="btn btn-outline-light btn-sm">Đăng nhập</a>
                    <a href="./register.html" class="btn btn-primary btn-sm">Đăng ký</a>
                </div>
                <div id="group-user">
                    <div class="nav-item dropdown text-light">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false" id="user-name">
                            ABC
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#">Thông tin cá nhân</a></li>
                            <li><a class="dropdown-item" href="./history.html">Lịch sử mua hàng</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><button id="logout" class="dropdown-item" href="#">Đăng xuất</button></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h4 class="mb-3">Thanh toán</h4>

        <!-- Hiện khi vào thẳng trang này mà giỏ chưa có gì -->
        <p id="pay-empty" class="text-muted d-none">
            Giỏ hàng đang trống, chưa thể thanh toán. <a href="./index.html">Quay lại mua sắm</a>
        </p>

        <div class="row g-4 d-none" id="pay-content">

            <!-- Bên trái: thông tin giao hàng -->
            <div class="col-12 col-md-7">
                <div class="card">
                    <div class="card-body">
                        <form id="pay-form">
                            <div class="mb-3">
                                <label for="pay-phone" class="form-label">Số điện thoại</label>
                                <input type="tel" class="form-control" id="pay-phone" placeholder="0901234567"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="pay-address" class="form-label">Địa chỉ nhận hàng</label>
                                <textarea class="form-control" id="pay-address" rows="3"
                                    placeholder="Số nhà, đường, phường, quận, thành phố" required></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Phương thức thanh toán</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="payment" id="pay-cod"
                                        value="Thanh toán khi nhận hàng (COD)" checked>
                                    <label class="form-check-label" for="pay-cod">
                                        Thanh toán khi nhận hàng (COD)
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="payment" id="pay-bank"
                                        value="Chuyển khoản ngân hàng">
                                    <label class="form-check-label" for="pay-bank">
                                        Chuyển khoản ngân hàng
                                    </label>
                                </div>
                            </div>

                            <!-- Khoá sẵn, pay.js chỉ mở khi đã biết chắc ai đang đăng nhập -->
                            <button type="submit" class="btn btn-primary w-100" id="btn-order" disabled>
                                Đang kiểm tra đăng nhập...
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Bên phải: các sản phẩm đã mua -->
            <div class="col-12 col-md-5">
                <div class="card">
                    <div class="card-header">Sản phẩm đã mua</div>
                    <ul class="list-group list-group-flush" id="pay-items"></ul>
                    <div class="card-body d-flex justify-content-between">
                        <span class="fw-bold">Tổng cộng</span>
                        <span class="text-danger fw-bold fs-5" id="pay-total"></span>
                    </div>
                </div>
                <a href="./cart.html" class="btn btn-link px-0">Sửa giỏ hàng</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
