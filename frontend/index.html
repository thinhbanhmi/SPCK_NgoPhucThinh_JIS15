<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Đơn Giản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Shop bán oxy
            </a>
            <div>
                <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal">Đăng nhập</button>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#registerModal">Đăng ký</button>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h4 class="mb-3">Sản phẩm</h4>
        <div class="row g-3">
            <div class="col-6 col-md-3">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/200" class="card-img-top" alt="SP">
                    <div class="card-body p-2 text-center">
                        <h6>Sản phẩm A</h6>
                        <p class="text-danger fw-bold mb-2">100.000đ</p>
                        <button class="btn btn-sm btn-primary w-100">Mua ngay</button>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/200" class="card-img-top" alt="SP">
                    <div class="card-body p-2 text-center">
                        <h6>Sản phẩm B</h6>
                        <p class="text-danger fw-bold mb-2">200.000đ</p>
                        <button class="btn btn-sm btn-primary w-100">Mua ngay</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
