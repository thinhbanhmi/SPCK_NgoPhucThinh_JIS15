<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Nội Dung - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Thêm sp</h4>
          </div>
          <div class="card-body">
            <form id="admin-form">
              
              <div class="mb-3">
                <label for="post-title" class="form-label fw-bold">Tiêu đề</label>
                <input type="text" class="form-control" id="post-title" placeholder="Nhập tiêu đề..." required>
              </div>

              <div class="mb-3">
                <label for="post-content" class="form-label fw-bold">Nội dung</label>
                <textarea class="form-control" id="post-content" rows="4" placeholder="Nhập nội dung..." required></textarea>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold d-block">Hình ảnh</label>
                <div class="mt-3">
                  <img id="preview-img" src="" alt="Ảnh xem trước" class="img-thumbnail d-none" style="max-height: 200px;">
                </div>
              </div>

              <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Đăng</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  </script>
</body>
</html>
