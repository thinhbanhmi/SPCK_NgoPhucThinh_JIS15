<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm - Admin</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Firebase -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"
        integrity="sha512-gCJuoyvPlJMaTPkYPfyfEt1KYPvoEE9PgGHlOU+Qtg+kLbBfEbiiim4PDj2ATWLc6BN0irZnNbdgzCtX53vjXQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"
        integrity="sha512-Xxpv+NpwNyir+77oEME5XeixRoRLrI4eY0bBZSMHgWLEFbc0f+JP4Nax3t/qDuYg1hgWrSl8pUapb+AO5Lp1jA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Firebase Authentication -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-auth-compat.min.js"
        integrity="sha512-PgwIBKz/MWPvQvKq7MUWB5x5aCyiiXTnAtbUGqbBvylcD/oASXh8wap5g1lWpzPmNraLXWzuWx8bkZ+reKYoyQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Firebase configuration script -->
    <script src="./script/firebase-config.js"></script>
    <script src="./script/navbar.js" defer></script>
    <script src="./script/admin.js" defer></script>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="./index.html">Shop bán oxy
            </a>
            <div id="group-login">
                <a href="./login.html" class="btn btn-outline-light btn-sm">Đăng nhập</a>
                <a href="./register.html" class="btn btn-primary btn-sm">Đăng ký</a>
            </div>
            <div id="group-user">
                <div class="nav-item dropdown text-light">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                        aria-expanded="false" id="user-name">
                        ABC
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Thông tin cá nhân</a></li>
                        <li><a class="dropdown-item" href="./history.html">Lịch sử mua hàng</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><button id="logout" class="dropdown-item" href="#">Đăng xuất</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4">

        <!-- Form thêm / sửa sản phẩm -->
        <h4 class="mb-3" id="form-title">Thêm sản phẩm</h4>
        <div class="card mb-4">
            <div class="card-body">
                <form id="product-form">

                    <div class="mb-3">
                        <label for="product-name" class="form-label">Tên sản phẩm</label>
                        <input type="text" class="form-control" id="product-name" placeholder="Ví dụ: Bình oxy 5 lít"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="product-price" class="form-label">Giá (đ)</label>
                        <input type="number" class="form-control" id="product-price" placeholder="100000" min="0"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="product-description" class="form-label">Mô tả</label>
                        <textarea class="form-control" id="product-description" rows="3"
                            placeholder="Nhập mô tả sản phẩm..." required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="product-image" class="form-label">Hình ảnh</label>
                        <input type="file" class="form-control" id="product-image" accept="image/*">
                        <div class="form-text">Khi sửa sản phẩm, nếu không chọn ảnh mới thì giữ ảnh cũ.</div>
                        <img id="preview-img" src="" alt="Ảnh xem trước" class="img-thumbnail mt-2 d-none"
                            style="max-height: 150px;">
                    </div>

                    <button type="submit" class="btn btn-primary" id="btn-submit">Thêm sản phẩm</button>
                    <button type="button" class="btn btn-secondary d-none" id="btn-cancel">Hủy</button>
                </form>
            </div>
        </div>

        <!-- Danh sách sản phẩm -->
        <h4 class="mb-3">Danh sách sản phẩm</h4>
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 90px;">Ảnh</th>
                            <th>Tên</th>
                            <th style="width: 130px;">Giá</th>
                            <th>Mô tả</th>
                            <th style="width: 150px;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body">
                        <tr>
                            <td colspan="5" class="text-center text-muted">Đang tải...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
